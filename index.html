<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>capynote</title>
  <link rel="icon" href="logo.png" type="image/png">
  <!-- 內建字體（Inter + Noto Sans TC，皆為可變字體，依 unicode-range 分檔載入）。
       獨立一支樣式表，因為它幾乎不會變，可以被瀏覽器快取；app.css 則是 no-store。 -->
  <link rel="stylesheet" href="vendor/fonts/fonts.css">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="vendor/hljs-github.min.css" id="hljs-theme-light">
  <link rel="stylesheet" href="app.css?v=242">
</head>
<body>
  <!-- Login gate: shown until /api/me returns a user -->
  <div id="auth-screen" class="auth-screen" hidden>
    <!-- 主題切換：跟頂列那顆存同一個 localStorage 鍵（js/auth.js 處理，app.js 還沒載入） -->
    <button id="auth-theme" type="button" class="auth-theme" title="切換深色／淺色" aria-label="切換深色／淺色"><span class="theme-ic theme-ic-light" data-icon="moon"></span><span class="theme-ic theme-ic-dark" data-icon="sun"></span></button>
    <div class="auth-wrap">
      <!-- 品牌：跟頂列 logo 同一份 mask 技巧，放大、重點色；在卡片外面，後端沒回應時也留著 -->
      <div class="auth-brand">
        <span class="auth-brand-mark" aria-hidden="true"></span>
        <div class="auth-brand-name">capynote</div>
        <div class="auth-brand-tag">滲透測試 · 檢定考試報告系統</div>
      </div>
      <div class="auth-box">
        <form id="auth-form" class="auth-form" autocomplete="on">
          <div id="auth-title" class="auth-title">登入</div>
          <label class="auth-field">
            <span>帳號</span>
            <!-- 圖示排在 input 後面，讓 CSS 的 input:focus + .auth-field-ic 這種
                 緊鄰選擇器抓得到（它只認「後面那個手足」，順序不能反過來） -->
            <input id="auth-username" type="text" autocomplete="username" autocapitalize="off" spellcheck="false">
            <span class="auth-field-ic" data-icon="user" aria-hidden="true"></span>
          </label>
          <label class="auth-field auth-field-pw">
            <span>密碼</span>
            <input id="auth-password" type="password" autocomplete="current-password">
            <span class="auth-field-ic" data-icon="lock" aria-hidden="true"></span>
            <!-- 顯示／隱藏密碼。<button> 放在 <label> 裡沒關係：瀏覽器不會把互動元素上的點擊轉給 input -->
            <button id="auth-eye" type="button" class="auth-eye" title="顯示密碼" aria-label="顯示密碼" aria-pressed="false"><span class="ic-on" data-icon="eye"></span><span class="ic-off" data-icon="eye-off"></span></button>
          </label>
          <label class="auth-field" id="auth-invite-row" hidden>
            <span>邀請碼</span>
            <input id="auth-invite" type="text" autocomplete="off" spellcheck="false">
            <span class="auth-field-ic" data-icon="key" aria-hidden="true"></span>
          </label>
          <div id="auth-hint" class="auth-hint" hidden>密碼至少 12 個字元。</div>
          <div id="auth-error" class="auth-error" hidden></div>
          <button id="auth-submit" type="submit" class="btn btn-primary auth-submit"><span class="auth-submit-text">登入</span></button>
        </form>
      </div>
      <button id="auth-toggle" type="button" class="link-btn auth-toggle">還沒有帳號？<b>建立一個</b></button>
    </div>
  </div>

  <div id="app" hidden>
    <!-- 左緣把手：滑過去或點一下拉出筆記抽屜 -->
    <button id="sidebar-reopen" class="sidebar-reopen" title="筆記清單 (Ctrl+\)" aria-label="開啟筆記清單" data-icon="chevron-right"></button>

    <!-- 全域頂列：跟筆記工具列同高的 bar，帳號選單在最右邊 -->
    <header id="topbar" class="topbar">
      <!-- 側邊欄是浮動抽屜（不佔寬度），用這顆鈕或 Ctrl+\ 拉出 -->
      <div class="topbar-left">
        <button id="sidebar-collapse" class="icon-btn" title="筆記清單 (Ctrl+\)" aria-label="開啟筆記清單" data-icon="panel-left"></button>
        <span class="logo" title="回到首頁"><span class="logo-mark" aria-hidden="true"></span><span class="logo-text">capynote</span></span>
      </div>

      <!-- 開啟筆記時，標題與編輯按鈕直接顯示在這條 bar 上（display:contents 併入 topbar）-->
      <div id="topbar-note" class="topbar-note">
        <!-- 檢視模式（分割／編輯／預覽）靠左：放在彈性空間之前，就會緊接在 logo 後面 -->
        <div class="mode-switch" role="group" aria-label="檢視模式">
          <button data-mode="split" class="mode-btn active" title="分割檢視" data-icon="columns"><span class="btn-label">分割</span></button>
          <button data-mode="edit" class="mode-btn" title="純編輯" data-icon="pen-line"><span class="btn-label">編輯</span></button>
          <button data-mode="preview" class="mode-btn" title="純預覽" data-icon="eye"><span class="btn-label">預覽</span></button>
        </div>
        <!-- 標題連同資料夾路徑前綴（如 測試資料夾\測試筆記）包成一組，整組絕對定位
             置中在頂列正中線；輸入框寬度由 app.js 依文字量測，兩者才接得起來 -->
        <div class="note-title-wrap">
          <span id="note-path" class="note-path" title="所在資料夾"></span>
          <input id="note-title" class="note-title" placeholder="未命名筆記" />
        </div>
        <!-- 保留標題原本吃掉的彈性空間，把水豚／版本／分享／PDF 這些右側按鈕推到最右 -->
        <div class="note-title-spacer" aria-hidden="true"></div>
        <!-- 彩蛋：打字時會出現一隻正面跳舞的小水豚 -->
        <span id="capybara" class="capybara" aria-hidden="true" title="卡皮巴拉正在為你加油 🎵">
          <svg viewBox="0 0 48 48" width="30" height="30">
            <rect class="capy-arm capy-arm-l" x="7"  y="29" width="6" height="12" rx="3" fill="#8c6038"/>
            <rect class="capy-arm capy-arm-r" x="35" y="29" width="6" height="12" rx="3" fill="#8c6038"/>
            <g class="capy-body">
              <rect x="12" y="27" width="24" height="18" rx="8" fill="#a9784e"/>
              <rect x="9" y="7" width="30" height="25" rx="10" fill="#b6875a"/>
              <ellipse cx="13" cy="8" rx="4" ry="3.4" fill="#8c6038"/>
              <ellipse cx="35" cy="8" rx="4" ry="3.4" fill="#8c6038"/>
              <circle cx="19" cy="17" r="2.3" fill="#2e2016"/>
              <circle cx="29" cy="17" r="2.3" fill="#2e2016"/>
              <rect x="15" y="21" width="18" height="10" rx="5" fill="#c99a6d"/>
              <circle cx="21" cy="26" r="1.2" fill="#2e2016"/>
              <circle cx="27" cy="26" r="1.2" fill="#2e2016"/>
            </g>
            <text class="capy-note" x="1" y="12" font-size="11">♪</text>
          </svg>
        </span>
        <div id="presence" class="presence" aria-label="在線協作者"></div>
        <button id="history-btn" class="btn" title="版本紀錄" data-icon="history"><span class="btn-label">版本</span></button>
        <button id="share-btn" class="btn" title="分享這篇筆記"><span class="btn-label">分享</span></button>
        <button id="export-pdf" class="btn btn-primary" title="輸出 PDF" data-icon="download"><span class="btn-label">PDF</span></button>
        <!-- 視窗窄到連圖示都放不下版本/分享/PDF 三顆鈕時（app.js 的 fitTopbar 量出來才會顯示），
             收成這一顆「更多」，開合原本那三顆鈕（同一組 click 處理，見 bindEvents） -->
        <button id="topbar-more-btn" class="icon-btn topbar-more-btn" title="更多操作" data-icon="more-horizontal"></button>
      </div>

      <div class="topbar-right">
        <button id="toggle-theme" class="icon-btn" title="切換深色/淺色"><span class="theme-ic theme-ic-light" data-icon="moon"></span><span class="theme-ic theme-ic-dark" data-icon="sun"></span></button>
        <div class="user-menu">
          <button id="user-btn" class="user-btn" title="帳號選單" aria-haspopup="true" aria-expanded="false">
            <span id="current-user"></span>
            <span class="user-caret" aria-hidden="true" data-icon="chevron-down"></span>
          </button>
          <div id="user-dropdown" class="user-dropdown" role="menu" hidden>
            <button id="passwd-btn" class="user-menu-item" role="menuitem" data-icon="key">更改密碼</button>
            <button id="admin-btn" class="user-menu-item" role="menuitem" hidden data-icon="users">帳號管理</button>
            <button id="storage-btn" class="user-menu-item" role="menuitem" hidden data-icon="activity">系統監控</button>
            <!-- 備份與還原（js/backup.js）：一個 zip 帶走全部資料，上傳同一個 zip 還原 -->
            <button id="backup-btn" class="user-menu-item" role="menuitem" data-icon="save">備份與還原</button>
            <!-- Android APP（android/）才看得到：改伺服器網址、清登入；js/auth.js 偵測 window.capynoteAndroid 才顯示 -->
            <button id="android-settings-btn" class="user-menu-item" role="menuitem" hidden data-icon="settings">APP 設定</button>
            <div class="user-menu-sep" role="separator"></div>
            <button id="logout-btn" class="user-menu-item danger" role="menuitem" data-icon="log-out">登出</button>
          </div>
        </div>
      </div>
    </header>

    <div id="app-body">
    <!-- Sidebar：浮動抽屜，覆蓋在主區上方而不擠壓它 -->
    <aside id="sidebar">
      <!-- 「新增」一顆鈕：點開選要新增筆記還是哪一種報告。選項保留原本的 id，
           app.js 裡各自的 click 處理不用改。 -->
      <div class="sidebar-actions">
        <div class="new-menu">
          <button id="new-btn" class="btn btn-primary new-btn" type="button" aria-haspopup="true" aria-expanded="false" data-icon="plus">新增<span class="new-caret" aria-hidden="true" data-icon="chevron-down"></span></button>
          <div id="new-dropdown" class="new-dropdown" role="menu" hidden>
            <button id="new-note" class="user-menu-item" role="menuitem" type="button" data-icon="file-plus">筆記</button>
            <div class="user-menu-sep" role="separator"></div>
            <button id="oscp-report" class="user-menu-item" role="menuitem" type="button" title="證照考試範本模式" data-icon="award">證照範本</button>
            <button id="sec-report" class="user-menu-item" role="menuitem" type="button" title="資安院報告模式" data-icon="shield">資安院報告</button>
            <button id="perf-report" class="user-menu-item" role="menuitem" type="button" title="成效報告模式" data-icon="chart">成效報告</button>
            <button id="rel-map" class="user-menu-item" role="menuitem" type="button" title="自由畫布的節點／連線圖，像簡化版的 React Flow" data-icon="network">關聯分析</button>
            <button id="new-doc" class="user-menu-item" role="menuitem" type="button" title="所見即所得的文件：工具列排版，像 Google 文件，不用 Markdown" data-icon="file-pen">文件</button>
            <button id="new-drawio" class="user-menu-item" role="menuitem" type="button" title="畫流程圖、網路架構圖：拖圖形、拉連線、改文字與顏色（版面像 draw.io 的基本繪圖工具）" data-icon="shapes">drawio</button>
            <div class="user-menu-sep" role="separator"></div>
            <button id="new-book" class="user-menu-item" role="menuitem" type="button" title="挑一個資料夾做成電子書；做過的電子書會列在首頁的「電子書」區" data-icon="book-open">電子書</button>
          </div>
        </div>
        <button id="new-folder" class="btn" data-icon="folder-plus">資料夾</button>
      </div>
      <!-- 四個獨立區域，各自的筆記跟資料夾都跟一般筆記分開放（server/api.js AREAS）：
           課程筆記、隨筆（Keep 風格）、知識區都是普通筆記只是分頁；小說多一關
           密碼（js/app.js promptNovelPassword），連筆記列表都要解鎖後才會送到瀏覽器。
           特意放在「新增」下面、筆記樹上面，跟底下的關聯圖／檔案管理／垃圾桶那排「工具」
           分開——這是切換去哪個區域的導覽，不是工具。 -->
      <nav class="sidebar-nav sidebar-areas" aria-label="區域">
        <button id="course-open-btn" class="sidebar-nav-item" type="button" title="課程筆記，跟一般筆記分開放" data-icon="award">課程筆記</button>
        <button id="quick-open-btn" class="sidebar-nav-item" type="button" title="隨手記一下，像 Google Keep 一樣的卡片牆" data-icon="pin">隨筆</button>
        <button id="knowledge-open-btn" class="sidebar-nav-item" type="button" title="自己整理彙整出來的筆記" data-icon="book-open">知識區</button>
        <button id="board-open-btn" class="sidebar-nav-item" type="button" title="像 Trello 一樣的看板：列表與卡片" data-icon="kanban">trello</button>
        <button id="start-open-btn" class="sidebar-nav-item" type="button" title="像 start.me 一樣的書籤起始頁" data-icon="layout-grid">start.me</button>
        <button id="xmind-open-btn" class="sidebar-nav-item" type="button" title="像 XMind 一樣的心智圖" data-icon="mind-map">xmind</button>
        <button id="timetree-open-btn" class="sidebar-nav-item" type="button" title="像 TimeTree 一樣的行事曆" data-icon="calendar">timetree</button>
        <button id="progress-open-btn" class="sidebar-nav-item" type="button" title="課程進度：輸入課程與章節，完成一章勾一章，進度與預計完成日會同步到課程筆記與 timetree" data-icon="list-checks">課程進度</button>
        <button id="foodmap-open-btn" class="sidebar-nav-item" type="button" title="圖資中心：自己建圖層（預設美食地圖、步道地圖），把名稱、地址、資料來源、標籤放上 OpenStreetMap" data-icon="map-pin">圖資中心</button>
        <!-- 個人區：小說＋影片（js/videos.js），需要再輸入一次密碼；id 沿用 novel，伺服器的 area 也還是 'novel' -->
        <button id="novel-open-btn" class="sidebar-nav-item" type="button" title="個人區（小說、影片），需要再輸入一次密碼才能進入" data-icon="lock">個人</button>
      </nav>
      <div class="search-row">
        <div class="search-box">
          <input id="search-input" type="text" placeholder="搜尋筆記…（Ctrl+K）"
                 autocomplete="off" spellcheck="false" aria-label="搜尋筆記">
          <button id="search-clear" class="search-clear" title="清除搜尋" hidden data-icon="x"></button>
        </div>
        <!-- 排序方式（js/sorting.js）：手動拖拉、名稱、建立時間、最近更新；首頁的清單用同一套 -->
        <button id="sort-btn" class="icon-btn sort-btn" type="button" title="排序方式" aria-haspopup="true" data-icon="arrow-up-down"></button>
      </div>
      <!-- 批次操作列：勾選筆記或資料夾後出現，可整批移動到資料夾或刪除 -->
      <div id="batch-bar" class="batch-bar" hidden>
        <span class="batch-count"></span>
        <div class="batch-actions">
          <button id="batch-move" class="batch-btn" type="button" title="移動所選項目到資料夾" data-icon="folder">移動</button>
          <button id="batch-share" class="batch-btn" type="button" title="一次設定所選筆記的一般存取權（例如開放給網站內所有人）" data-icon="users">共用</button>
          <button id="batch-delete" class="batch-btn danger" type="button" title="刪除所選項目（資料夾直接刪除，筆記移到垃圾桶）" data-icon="trash">刪除</button>
          <button id="batch-clear" class="batch-btn ghost" type="button" title="取消選取" data-icon="x"></button>
        </div>
      </div>
      <div id="tree" class="tree" data-root="true"></div>
      <div id="search-results" class="search-results" hidden></div>
      <!-- 左下角工具，一顆一列、跟側邊欄等寬：關聯圖（反向連結＋標籤的力導向圖）、
           檔案管理（上傳過的圖片／PDF／其他檔案與它們用在哪些筆記）、垃圾桶（刪除的筆記保留期內可復原）。
           id 沿用原本頂端按鈕的，app.js 裡的 click 處理不用改。 -->
      <nav class="sidebar-nav" aria-label="工具">
        <button id="graph-open-btn" class="sidebar-nav-item" type="button" title="用力導向圖看所有筆記的反向連結跟標籤關聯" data-icon="graph">關聯圖</button>
        <button id="images-open-btn" class="sidebar-nav-item" type="button" title="上傳過的圖片、PDF 與其他檔案：看每個用在哪些筆記，清掉沒有筆記在用的" data-icon="files">檔案管理</button>
        <button id="trash-open-btn" class="sidebar-nav-item" type="button" title="刪除的筆記會先放在這裡，保留期內可以復原或永久刪除" data-icon="trash">垃圾桶</button>
      </nav>
      <div class="sidebar-foot">
        <button id="import-btn" class="link-btn" title="匯入 .md 檔案或整個資料夾，放到目前所在的區域和資料夾">匯入 .md</button>
        <input type="file" id="import-input" accept=".md,.markdown,text/markdown,image/*,.pdf" multiple hidden>
        <input type="file" id="import-dir-input" webkitdirectory multiple hidden>
      </div>
    </aside>

    <!-- Main -->
    <main id="main">
      <div id="empty-state" class="empty-state">
        <div id="dashboard" class="dashboard"></div>
      </div>

      <div id="editor-wrap" class="editor-wrap" hidden>
        <div class="panes" id="panes">
          <section class="pane pane-edit">
            <div class="edit-toolbar" id="edit-toolbar">
              <button data-fmt="h1" title="標題 1" data-icon="heading-1"></button>
              <button data-fmt="h2" title="標題 2" data-icon="heading-2"></button>
              <button data-fmt="h3" title="標題 3" data-icon="heading-3"></button>
              <span class="tb-sep"></span>
              <button data-fmt="bold" title="粗體" data-icon="bold"></button>
              <button data-fmt="italic" title="斜體" data-icon="italic"></button>
              <button data-fmt="strike" title="刪除線" data-icon="strikethrough"></button>
              <span class="tb-sep"></span>
              <button data-fmt="codeblock" title="程式碼區塊" data-icon="square-code"><span class="tb-txt">Code</span></button>
              <button data-fmt="code" title="行內程式碼" data-icon="code"></button>
              <button data-fmt="callout" title="Callout 提示框" data-icon="message-square"></button>
              <button data-fmt="quote" title="引言" data-icon="quote"></button>
              <span class="tb-sep"></span>
              <button data-fmt="ul" title="項目清單" data-icon="list"></button>
              <button data-fmt="ol" title="編號清單" data-icon="list-ordered"></button>
              <button data-fmt="task" title="待辦清單" data-icon="list-checks"></button>
              <span class="tb-sep"></span>
              <button data-fmt="link" title="連結" data-icon="link"></button>
              <button data-fmt="notelink" title="連結到其他筆記（也可輸入 [[ ）" data-icon="files"><span class="tb-txt">筆記</span></button>
              <button data-fmt="image" title="圖片" data-icon="image"></button>
              <button data-fmt="file" title="上傳檔案：圖片、PDF 或任何附件（也可以直接拖進來、貼上，或輸入 /file）" data-icon="paperclip"><span class="tb-txt">檔案</span></button>
              <button data-fmt="table" title="表格" data-icon="table"></button>
              <button data-fmt="hr" title="分隔線" data-icon="minus"></button>
              <span class="tb-sep"></span>
              <button data-fmt="template" title="插入範本（機器、AD Set，或你自己新增的）" data-icon="template"><span class="tb-txt">範本</span></button>
            </div>
            <div class="editor-area" id="editor-area">
            <div class="editor-backdrop" id="editor-backdrop" aria-hidden="true"></div>
            <textarea id="editor" spellcheck="false" placeholder="# 開始撰寫…

支援 GitHub Flavored Markdown 與 Callout：

> [!NOTE]
> 這是一個提示區塊。

直接貼上圖片（Ctrl/Cmd+V）即可插入。"></textarea>
            </div>
          </section>
          <div class="divider" id="divider"></div>
          <section class="pane pane-preview">
            <button id="toc-show" class="toc-show" title="顯示目錄" data-icon="list">目錄</button>
            <nav id="preview-toc" class="preview-toc" aria-label="目錄"></nav>
            <div class="preview-scroll" id="preview-scroll">
              <article id="preview" class="markdown-body"></article>
              <!-- outside #preview so it never lands in the PDF export -->
              <aside id="backlinks" class="backlinks" hidden></aside>
            </div>
          </section>
        </div>
        <div class="statusbar">
          <span id="status-info"></span>
          <span id="status-cursors" class="status-cursors"></span>
          <span id="status-save"></span>
        </div>
      </div>

      <!-- 資安院報告模式：整個右側是步驟式編輯器，取代 md 編輯器 -->
      <div id="sec-wrap" class="sec-wrap" hidden>
        <div class="toolbar">
          <input id="sec-title" class="note-title" placeholder="資安院報告標題" />
          <div class="toolbar-right">
            <span class="sec-badge" data-icon="shield">資安院報告模式</span>
            <label class="sec-date-label">日期
              <input id="sec-date" type="date" class="sec-date">
            </label>
            <button id="sec-export-pdf" class="btn btn-primary" title="輸出 PDF" data-icon="download">PDF</button>
          </div>
        </div>
        <div class="sec-editor-scroll" id="sec-editor-scroll">
          <div id="sec-info" class="sec-info"></div>
          <div id="sec-steps" class="sec-steps-live"></div>
          <button id="sec-add-step" class="sec-add-live" type="button" data-icon="plus">新增文字描述框</button>
        </div>
        <div class="statusbar">
          <span id="sec-status-info"></span>
          <span id="sec-status-save"></span>
        </div>
      </div>

      <!-- 成效報告模式：表格式，會即時統計風險分布與修復率 -->
      <div id="perf-wrap" class="sec-wrap perf-wrap" hidden>
        <div class="toolbar">
          <input id="perf-title" class="note-title" placeholder="成效報告標題" />
          <div class="toolbar-right">
            <span class="sec-badge perf-badge" data-icon="chart">成效報告模式</span>
            <label class="sec-date-label">日期
              <input id="perf-date" type="date" class="sec-date">
            </label>
            <button id="perf-export-pdf" class="btn btn-primary" title="輸出 PDF" data-icon="download">PDF</button>
          </div>
        </div>
        <div class="sec-editor-scroll" id="perf-editor-scroll">
          <div id="perf-info" class="sec-info"></div>
          <div id="perf-stats" class="perf-stats"></div>
          <div id="perf-table-wrap" class="perf-table-wrap"></div>
          <button id="perf-add-row" class="sec-add-live" type="button" data-icon="plus">新增弱點</button>
          <div id="perf-summary-wrap" class="perf-summary-wrap"></div>
        </div>
        <div class="statusbar">
          <span id="perf-status-info"></span>
          <span id="perf-status-save"></span>
        </div>
      </div>
      <!-- 電子書模式：把一個資料夾當成一本書來閱讀（GitBook 式三欄），可出版成單檔 HTML -->
      <div id="book-wrap" class="book-wrap" hidden></div>
      <!-- 垃圾桶頁（#trash）：刪除的筆記保留期內可復原或永久刪除，內容由 js/trash.js 畫 -->
      <div id="trash-wrap" class="trash-wrap" hidden>
        <div id="trash-page" class="dashboard trash-page"></div>
      </div>
      <!-- 檔案管理（#files）：整頁的檔案庫／雲端硬碟，內容由 js/imagelib.js 畫進來 -->
      <div id="files-wrap" class="files-wrap" hidden></div>
      <!-- 四個獨立區域頁面（js/areabrowser.js 畫課程筆記／知識區／小說；js/quicknotes.js 畫隨筆），
           版面跟垃圾桶頁同一套：一個可捲動的外框 + Dashboard 風格的內容格線。 -->
      <div id="course-wrap" class="trash-wrap area-wrap" hidden>
        <div id="course-page" class="dashboard trash-page"></div>
      </div>
      <div id="knowledge-wrap" class="trash-wrap area-wrap" hidden>
        <div id="knowledge-page" class="dashboard trash-page"></div>
      </div>
      <!-- 個人區（#novel／#videos）：上面一排分頁切換 小說（AreaBrowser）／影片（js/videos.js），
           兩個都在同一道密碼後面（app.js openArea('novel') / openVideos） -->
      <div id="novel-wrap" class="trash-wrap area-wrap" hidden>
        <div class="pa-bar">
          <nav class="pa-tabs" aria-label="個人區">
            <button class="pa-tab is-active" type="button" data-pa="novel" data-icon="book">小說</button>
            <button class="pa-tab" type="button" data-pa="videos" data-icon="film">影片</button>
          </nav>
        </div>
        <div id="novel-page" class="dashboard trash-page"></div>
        <div id="videos-page" class="vd-page" hidden></div>
      </div>
      <div id="quick-wrap" class="trash-wrap area-wrap" hidden>
        <div id="quick-page" class="quick-page"></div>
      </div>
      <!-- 看板（js/board.js）：#board 是所有看板的列表頁；一個看板（meta.board 的筆記）開在 #kanban-wrap 整頁 -->
      <div id="boards-wrap" class="trash-wrap area-wrap" hidden>
        <div id="boards-page" class="boards-page"></div>
      </div>
      <div id="kanban-wrap" class="kanban-wrap" hidden></div>
      <!-- 文件（js/doc.js）：所見即所得的編輯器，一篇 meta.doc 的筆記開在這裡整頁 -->
      <div id="doc-wrap" class="doc-wrap" hidden></div>
      <!-- 起始頁（js/startpage.js）：#start，一個畫面、上面是分頁；每一頁是一篇 meta.startpage 的筆記 -->
      <div id="start-wrap" class="trash-wrap area-wrap" hidden>
        <div id="start-page"></div>
      </div>
      <!-- 心智圖（js/xmind.js）：#xmind 是所有心智圖的列表頁；一張圖（meta.xmind 的筆記）開在 #xmind-edit-wrap 整頁 -->
      <div id="xmind-wrap" class="trash-wrap area-wrap" hidden>
        <div id="xmind-page" class="boards-page xmind-page"></div>
      </div>
      <div id="xmind-edit-wrap" class="xmind-edit-wrap" hidden></div>
      <!-- 行事曆（js/timetree.js）：#timetree 一個畫面（照 TimeTree）；每一本行事曆是一篇 meta.timetree 的筆記 -->
      <div id="timetree-wrap" class="trash-wrap area-wrap" hidden>
        <div id="timetree-page"></div>
      </div>
      <!-- 課程進度（js/progress.js）：#progress 一個畫面；每一門課程是一篇 meta.progress 的筆記，綁課程筆記資料夾與 timetree 的「課程管理」行事曆 -->
      <div id="progress-wrap" class="trash-wrap area-wrap" hidden>
        <div id="progress-page"></div>
      </div>
      <!-- 圖資中心（js/foodmap.js，原美食地圖）：#foodmap 一個畫面；每一個圖層是一篇 meta.foodmap 的筆記，底圖是 OpenStreetMap（vendor/leaflet） -->
      <div id="foodmap-wrap" class="trash-wrap area-wrap" hidden>
        <div id="foodmap-page"></div>
      </div>
      <!-- 關聯分析（js/relmap.js）：整頁的畫布編輯器，不是浮在上面的視窗。一篇 meta.relMap
           的筆記直接開在這裡；一般筆記裡的 ```relmap 區塊按「全螢幕」也是開到這裡，完成後回筆記。 -->
      <div id="relmap-wrap" class="relmap-wrap" hidden></div>
      <!-- drawio（js/drawio.js）：整頁的繪圖工具，版面照 draw.io 的樣子、功能只做基本的。
           一篇 meta.drawio 的筆記直接開在這裡。 -->
      <div id="drawio-wrap" class="drawio-wrap" hidden></div>
      <!-- 關聯圖（js/graph.js）：整頁的力導向圖，跟垃圾桶／區域頁一樣接管 #main -->
      <div id="graph-wrap" class="graph-wrap" hidden></div>
    </main>
    </div><!-- /#app-body -->
  </div>

  <!-- Context menu -->
  <div id="ctx-menu" class="ctx-menu" hidden></div>
